<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D 미니 배드민턴 (승리 세리머니 + 서브 + 다양한 샷)</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f0f0f0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Arial', sans-serif; }
        #gameCanvas { background: linear-gradient(to bottom, #87CEEB, #E0F7FA); border: 2px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        #mobileControls { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 10px; box-sizing: border-box; pointer-events: none; }
        .controlBtn { width: 60px; height: 60px; background-color: rgba(255, 255, 255, 0.7); border: 2px solid #555; border-radius: 50%; font-size: 24px; pointer-events: auto; user-select: none; }
        .controlBtn:active { background-color: rgba(255, 255, 255, 1); }
        #uiOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #restartBtn { position: absolute; top: 10px; right: 10px; background-color: #FF5722; color: white; border: none; padding: 10px 20px; font-size: 16px; pointer-events: auto; display: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div id="uiOverlay">
        <div style="font-size: 24px; font-weight: bold; margin-top: 10px;">2D BADMINTON CHALLENGE</div>
        <div id="scoreDisplay" style="font-size: 32px; font-weight: bold; margin-top: 10px;">PLAYER A: [0] | PLAYER B: [0]</div>
        <div id="winnerDisplay" style="font-size: 48px; font-weight: bold; margin-top: 60px; display: none; color: gold;">PLAYER A WINS!</div>
    </div>
    <button id="restartBtn" onclick="initGame()">RESTART</button>

    <div id="mobileControls">
        <div style="display: flex; gap: 10px;">
            <button class="controlBtn" id="btnLeft">←</button>
            <button class="controlBtn" id="btnUp">↑</button>
            <button class="controlBtn" id="btnRight">→</button>
        </div>
        <button class="controlBtn" style="font-weight: bold; color: red;" id="btnHit">HIT</button>
    </div>

<script>
    // --- constants & Setup ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const winnerDisplay = document.getElementById('winnerDisplay');
    const restartBtn = document.getElementById('restartBtn');
    
    const cw = canvas.width;
    const ch = canvas.height;
    const floorY = ch - 50;
    const netX = cw / 2;
    const gravity = 0.4;
    const playerSpeed = 5;
    const playerJumpForce = -10;
    const drag = 0.99; // Air resistance for shuttlecock
    
    // --- Audio setup (Web Audio API - no external files needed) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playHitSound() {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const types = ['ting', 'tong', 'phoosh'];
        const type = types[Math.floor(Math.random() * types.length)];
        let freq, duration;
        if (type === 'ting') { freq = 2000; duration = 0.05; }
        else if (type === 'tong') { freq = 800; duration = 0.08; }
        else { freq = 400; duration = 0.15; }
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + duration);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    // --- Object Classes ---
    class Player {
        constructor(x, y, color) {
            this.pos = { x: x, y: y };
            this.vel = { x: 0, y: 0 };
            this.w = 30; this.h = 60;
            this.color = color;
            this.score = 0;
            this.holdingBall = false; // Is this player holding for serve?
        }
        draw() {
            ctx.fillStyle = this.color; ctx.fillRect(this.pos.x, this.pos.y, this.w, this.h);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
            const raquetX = this.color === 'red' ? this.pos.x + this.w + 5 : this.pos.x - 20;
            const raquetY = this.pos.y + 15;
            ctx.beginPath(); ctx.arc(raquetX, raquetY, 15, 0, Math.PI * 2); ctx.stroke();
            ctx.moveTo(raquetX, raquetY + 15); ctx.lineTo(raquetX, raquetY + 30); ctx.stroke();
        }
        update() {
            this.vel.y += gravity;
            this.pos.x += this.vel.x;
            this.pos.y += this.vel.y;
            if (this.pos.y + this.h > floorY) { this.pos.y = floorY - this.h; this.vel.y = 0; }
            if (this.color === 'red') {
                if (this.pos.x < 0) this.pos.x = 0;
                if (this.pos.x + this.w > netX - 5) this.pos.x = netX - this.w - 5;
            } else { // Blue (AI)
                if (this.pos.x < netX + 5) this.pos.x = netX + 5;
                if (this.pos.x + this.w > cw) this.pos.x = cw - this.w;
            }
        }
    }

    class Shuttlecock {
        constructor() { this.reset(); }
        reset() {
            this.pos = { x: cw * 0.25, y: floorY - 90 }; this.vel = { x: 0, y: 0 };
            this.w = 10; this.h = 10; this.inPlay = false; this.held = true;
        }
        draw() {
            ctx.fillStyle = '#fff'; ctx.fillRect(this.pos.x, this.pos.y, this.w, this.h);
            ctx.beginPath(); ctx.arc(this.pos.x + this.w/2, this.pos.y + this.h, 5, 0, Math.PI); ctx.fill();
        }
        update() {
            if (!this.inPlay || this.held) return;
            this.vel.y += gravity;
            this.vel.x *= drag; // Apply drag
            this.vel.y *= drag;
            this.pos.x += this.vel.x; this.pos.y += this.vel.y;
        }
    }

    // --- 6 Variable Shot Dictionary ---
    const shotTypes = {
        'fast_smash': { vx: 22, vy: -4, label: 'Fast Smash' }, // Adjusted for PlayerA side
        'slow_drop':  { vx: 8, vy: -3, label: 'Slow Drop' },
        'low_drive': { vx: 15, vy: -1.5, label: 'Low Drive' },
        'high_lob':  { vx: 9, vy: -16, label: 'High Lob' },
        'long_clear': { vx: 16, vy: -11, label: 'Long Clear' },
        'short_net': { vx: 6, vy: -5, label: 'Short Drop (Net)' }
    };

    function chooseRandomShot() {
        const types = Object.keys(shotTypes);
        return types[Math.floor(Math.random() * types.length)];
    }

    // --- Game Logic ---
    let playerA, playerB, shuttlecock, keys = {}, gameState, winner;
    
    function initGame() {
        playerA = new Player(50, floorY - 60, 'red');
        playerB = new Player(cw - 80, floorY - 60, 'blue');
        shuttlecock = new Shuttlecock();
        scoreDisplay.textContent = 'PLAYER A: [0] | PLAYER B: [0]';
        winnerDisplay.style.display = 'none';
        restartBtn.style.display = 'none';
        gameState = 'SERVING_A'; // Starting state
        playerA.holdingBall = true;
        shuttlecock.held = true;
        shuttlecock.pos.x = playerA.pos.x + playerA.w + 10;
        shuttlecock.pos.y = playerA.pos.y + 15;
    }

    function checkCollision() {
        if (!shuttlecock.inPlay) return;
        const distA = Math.hypot((shuttlecock.pos.x + 5) - (playerA.pos.x + playerA.w + 5), (shuttlecock.pos.y + 5) - (playerA.pos.y + 15));
        if (distA < 25 && keys[' '] && gameState === 'PLAYING') { hit(playerA); }
        const distB = Math.hypot((shuttlecock.pos.x + 5) - (playerB.pos.x - 20), (shuttlecock.pos.y + 5) - (playerB.pos.y + 15));
        if (distB < 25 && gameState === 'PLAYING') { hit(playerB); }
        // Net check
        if (shuttlecock.pos.x > netX - 5 && shuttlecock.pos.x < netX + 5 && shuttlecock.pos.y > ch - 120 && gameState === 'PLAYING') scorePoint('B');
        // Floor check
        if (shuttlecock.pos.y + shuttlecock.h >= floorY && gameState === 'PLAYING') scorePoint(shuttlecock.pos.x < netX ? 'B' : 'A');
        // Out of bounds check
        if (shuttlecock.pos.x < 0 || shuttlecock.pos.x > cw) scorePoint(shuttlecock.pos.x < 0 ? 'B' : 'A');
    }

    function hit(player) {
        shuttlecock.inPlay = true;
        shuttlecock.held = false;
        playHitSound();
        const typeKey = chooseRandomShot();
        const baseShot = shotTypes[typeKey];
        if (player === playerA) {
            shuttlecock.vel.x = baseShot.vx + (Math.random() - 0.5) * 2;
            shuttlecock.vel.y = baseShot.vy + (Math.random() - 0.5) * 1.5;
        } else { // PlayerB AI: flip velocity
            shuttlecock.vel.x = -baseShot.vx + (Math.random() - 0.5) * 2;
            shuttlecock.vel.y = baseShot.vy + (Math.random() - 0.5) * 1.5;
        }
    }

    function serve() {
        if (gameState !== 'SERVING_A') return;
        gameState = 'PLAYING'; playerA.holdingBall = false;
        shuttlecock.vel.x = 12; shuttlecock.vel.y = -6; // Basic serve trajectory
        playHitSound();
    }

    function scorePoint(winnerChar) {
        shuttlecock.inPlay = false; shuttlecock.vel = { x: 0, y: 0 };
        if (winnerChar === 'A') playerA.score++; else playerB.score++;
        scoreDisplay.textContent = `PLAYER A: [${playerA.score}] | PLAYER B: [${playerB.score}]`;
        if (playerA.score >= 11 || playerB.score >= 11) { endGame(playerA.score >= 11 ? 'A' : 'B'); }
        else { resetPositions(); }
    }

    function resetPositions() {
        shuttlecock.reset(); playerA.pos = { x: 50, y: floorY - 60 }; playerB.pos = { x: cw - 80, y: floorY - 60 };
        gameState = 'SERVING_A'; playerA.holdingBall = true; shuttlecock.held = true;
        shuttlecock.pos.x = playerA.pos.x + playerA.w + 10; shuttlecock.pos.y = playerA.pos.y + 15;
    }

    function endGame(winnerChar) {
        winner = winnerChar === 'A' ? playerA : playerB;
        gameState = winnerChar === 'A' ? 'A_WINS' : 'B_WINS';
        winnerDisplay.textContent = `PLAYER ${winnerChar} WINS!`; winnerDisplay.style.display = 'block'; restartBtn.style.display = 'block';
    }

    function runAI() {
        if (gameState !== 'PLAYING') return;
        const targetX = shuttlecock.pos.x; const targetDist = cw * 0.1;
        if (playerB.pos.x < targetX - 5) playerB.vel.x = playerSpeed; else if (playerB.pos.x > targetX + targetDist) playerB.vel.x = -playerSpeed; else playerB.vel.x = 0;
        if (shuttlecock.pos.y < playerB.pos.y - 10 && shuttlecock.pos.y > ch * 0.4) playerB.vel.y = playerJumpForce;
    }

    // --- Winning Celebration Animation ---
    function celebrateWinner(winnerPlayer) {
        const celebrationSpeed = 0.2; const jumpHeight = 60;
        winnerPlayer.pos.y = floorY - winnerPlayer.h - Math.abs(jumpHeight * Math.sin(Date.now() * celebrationSpeed));
    }

    // --- Drawing ---
    function draw() {
        ctx.clearRect(0, 0, cw, ch);
        ctx.fillStyle = '#8BC34A'; ctx.fillRect(0, floorY, cw, 50); ctx.fillStyle = '#fff'; ctx.fillRect(netX - 5, ch - 120, 10, 120);
        playerA.draw(); playerB.draw(); shuttlecock.draw();
    }

    // --- Game Loop ---
    function loop() {
        if (gameState === 'SERVING_A') {
            shuttlecock.pos.x = playerA.pos.x + playerA.w + 10;
            shuttlecock.pos.y = playerA.pos.y + 15;
        } else if (gameState === 'PLAYING') {
            if (keys['ArrowLeft'] || keys['btnLeft']) playerA.vel.x = -playerSpeed; else if (keys['ArrowRight'] || keys['btnRight']) playerA.vel.x = playerSpeed; else playerA.vel.x = 0;
            if ((keys['ArrowUp'] || keys['btnUp']) && playerA.pos.y + playerA.h === floorY) playerA.vel.y = playerJumpForce;
            runAI(); playerA.update(); playerB.update(); shuttlecock.update(); checkCollision();
        } else if (gameState === 'A_WINS') { celebrateWinner(playerA); } else if (gameState === 'B_WINS') { celebrateWinner(playerB); }
        draw(); requestAnimationFrame(loop);
    }

    // --- Input Handling (PC + Mobile) ---
    window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ' && gameState === 'SERVING_A') serve(); });
    window.addEventListener('keyup', e => keys[e.key] = false);
    const btns = ['btnLeft', 'btnUp', 'btnRight', 'btnHit'].forEach(id => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', e => { e.preventDefault(); keys[id] = true; if (id === 'btnHit' && gameState === 'SERVING_A') serve(); if (id === 'btnHit' && gameState === 'PLAYING') keys[' '] = true; });
        btn.addEventListener('touchend', e => { e.preventDefault(); keys[id] = false; if (id === 'btnHit' && gameState === 'PLAYING') keys[' '] = false; });
    });

    initGame(); loop();
</script>
</body>
</html>
